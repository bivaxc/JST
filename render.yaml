services:
  - type: web
    name: jst-omc-portal
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: python -m compileall -q .
    startCommand: python server.py
    healthCheckPath: /healthz
    disk:
      name: jst-omc-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JST_DATA_DIR
        value: /var/data
      - key: JST_ADMIN_PASSWORD
        sync: false
